<body><main class="gallery">
<header class="hero"><div><div class="eyebrow">Offline-first · personal nutrition + training</div><h1>Intake</h1><p>A calm, precise companion for eating and training with a dairy allergy. Protein takes the lead; hidden ingredients never get buried.</p></div><div class="pill">Visual prototype · tap around</div></header>
<div id="gallery"></div>
</main>
<script>
const nav=[['◷','Today'],['▤','Plan'],['↗','Train'],['⌁','Progress'],['☰','More']];
function status(){return `<div class="status"><span>9:41</span><span>●●●　◖　▰</span></div>`}
function bottom(active='Today'){return `<nav class="bottom">${nav.map(([i,n])=>`<button class="navitem ${active===n?'active':''}" type="button"><span class="ico">${i}</span><span>${n}</span></button>`).join('')}</nav>`}
function phone(content,{dark=false,active='Today',bar=true,navshow=true}={}){return `<div class="phone ${dark?'dark':''}">${status()}${bar?`<header class="appbar"><div class="brand">in<b>take</b></div><div class="avatar">J</div></header>`:''}<div class="screen">${content}</div>${navshow?bottom(active):''}</div>`}
function ring(){return `<div class="ring-card"><div class="ring"><svg viewBox="0 0 140 140"><circle class="track" cx="70" cy="70" r="58"/><circle class="protein" cx="70" cy="70" r="58"/><circle class="track" cx="70" cy="70" r="45"/><circle class="carbs" cx="70" cy="70" r="45"/><circle class="track" cx="70" cy="70" r="32"/><circle class="fat" cx="70" cy="70" r="32"/></svg><div class="ring-center"><strong>1,640</strong><span>of 2,040 kcal</span><small>400 kcal remaining</small></div></div><div class="macro-row"><div class="macro prot"><b>70 / 190 g</b><small>PROTEIN · LEFT 120 g</small></div><div class="macro carb"><b>168 / 240 g</b><small>CARBS</small></div><div class="macro fat"><b>54 / 70 g</b><small>FAT</small></div></div></div><div class="remaining"><strong>120 g protein left · 400 kcal to spend</strong>One meal at a time. You've got room to finish strong.</div>`}
function today(){return `<div class="date-row"><button aria-label="Previous day">‹</button><div class="date-title"><strong>Today · Saturday</strong><small>November 7</small></div><button aria-label="Next day">›</button></div>${ring()}<div class="sectionline"><h3>Meals</h3><button class="textbutton">Day view</button></div><div class="meal"><div class="meal-head"><strong>Breakfast</strong><span>420 kcal</span></div><div class="food"><span>Greek-style coconut yoghurt · 170 g</span><small>5 g protein</small></div><div class="food"><span>Blueberries · 80 g</span><small>1 g protein</small></div></div><div class="meal"><div class="meal-head"><strong>Lunch</strong><span>510 kcal</span></div><div class="food"><span>Chicken thigh · 150 g</span><small>314 kcal · 34 g protein</small></div><div class="food"><span>Roasted potatoes · 180 g</span><small>4 g protein</small></div></div><div class="meal"><div class="meal-head"><strong>Dinner</strong><span>Not logged</span></div><div class="food"><span>Ready when you are</span><small>＋ Add food</small></div></div><div class="meal"><div class="meal-head"><strong>Snacks</strong><span>310 kcal</span></div><div class="food"><span>Apple · 1 medium</span><small>0 g protein</small></div></div><button class="add-food" aria-label="Add food">＋</button>`}
function foodSheet(){return `<div class="sheet-handle"></div><div class="sheet-head"><h3>Add food</h3><button class="close">×</button></div><div class="tabs" data-tabs><button class="tab active">Recents</button><button class="tab">Search</button><button class="tab">Barcode</button><button class="tab">Quick add</button><button class="tab">My foods</button></div><div class="searchbox">⌕ <input placeholder="Search foods"></div><div class="sectionline"><h3>Recently logged</h3><span style="font-size:10px;color:var(--sub)">On this phone</span></div>${[['🍗','Chicken thigh','150 g · Lunch','314','34'],['🥥','Coconut yoghurt, Greek-style','170 g · Breakfast','142','5'],['🥔','Roasted potatoes','180 g · Dinner','278','5'],['🍎','Apple, medium','1 medium · Snack','95','0'],['🥛','Oat milk latte','12 fl oz · Yesterday','120','3']].map(x=>`<div class="food-row"><div class="food-icon">${x[0]}</div><div class="food-details"><b>${x[1]}</b><small>${x[2]}</small></div><div class="food-kcal">${x[3]}<small>kcal · ${x[4]}g P</small></div></div>`).join('')}<div class="remaining" style="margin-top:14px"><strong>Food safety is always checked</strong>Intake checks ingredients for casein, whey, lactalbumin and other hidden dairy before saving.</div>`}
function portion(){return `<div class="sheet-handle"></div><div class="sheet-head"><h3>Chicken thigh</h3><button class="close">×</button></div><p class="subcopy">Cooked, boneless · per 100 g: 209 kcal · 22.7 g protein</p><span class="label">Serving size</span><div class="chips"><button class="chip" data-grams="100">100 g</button><button class="chip selected" data-grams="150">150 g</button><button class="chip" data-grams="200">200 g</button><button class="chip" data-grams="250">250 g</button></div><label class="label" for="grams">Grams</label><div class="gram-field"><input id="grams" type="number" min="0" value="150" aria-label="Serving grams"><span>g</span></div><div class="math"><div><b id="kcal">314</b><small>kcal</small></div><div><b id="prot">34.1</b><small>protein g</small></div><div><b id="carb">0</b><small>carbs g</small></div><div><b id="fatval">19.5</b><small>fat g</small></div></div><button class="primary-btn">Add to Lunch · 314 kcal</button><div class="remaining" style="margin-top:12px"><strong>Ingredient check passed</strong>No dairy terms found in the saved ingredient list.</div>`}
function allergen(amber=false){return `<div class="sheet-handle"></div><div class="sheet-head"><h3>${amber?'Check this item':'Food safety check'}</h3><button class="close">×</button></div><div class="warn-banner ${amber?'amber':''}"><div class="warn-top"><span class="warn-icon">${amber?'!':'⚠'}</span>${amber?'May contain · soft match':'Save blocked · dairy detected'}</div><h3>${amber?'Possible cross-contact':'This contains a dairy ingredient'}</h3><p>${amber?'The word “milk” appears in the name, but this oat milk latte is not a confirmed dairy match. Check the brand’s allergen statement.':'Your allergy profile matched an ingredient. The food cannot be saved until you choose what to do.'}</p></div><div class="allergen-food"><div><b>${amber?'Oat milk latte':'Protein bar · chocolate crisp'}</b><small>${amber?'12 fl oz · 120 kcal · 3 g protein':'1 bar · 210 kcal · 20 g protein'}</small></div><div class="blocked">${amber?'REVIEW':'NOT SAVED'}</div></div>${amber?`<div class="amber-note"><b>Lower-level warning</b> “Milk” is a soft name match, not evidence this oat drink contains dairy. Confirm the package label before logging.</div>`:`<div class="blocking-label">⛔ Save is blocked until you make a choice</div><div class="ing-card"><span style="font-weight:800;color:var(--fg)">Ingredients</span><br>Whey protein isolate, cocoa, chicory root, <span class="match">lactalbumin</span>, sunflower lecithin, natural flavors.</div><div class="warn-banner" style="margin-top:10px;padding:12px 14px"><div class="warn-top" style="font-size:10px"><span class="warn-icon" style="width:27px;height:27px;font-size:16px">!</span>Exact match found</div><p style="margin:7px 0 0;font-size:12px"><b>“lactalbumin” found in the ingredients</b></p></div>`}<div class="warn-actions"><button class="dont">${amber?'Don’t log it':'Don’t log it'}</button><button class="anyway">${amber?'Log after checking':'Log it anyway'}</button></div><p style="font-size:10px;color:var(--sub);line-height:1.4;text-align:center;margin:10px 8px">${amber?'This amber review is not a confirmed allergen block.':'Only log it anyway if you have personally verified this food is safe for you.'}</p>`}
function plan(){return `<div class="subhead">Your meal plan</div><p class="subcopy">12 weeks · built around what works for you</p><div class="weekstrip">${Array.from({length:12},(_,i)=>`<button class="week ${i===4?'active':''}">W${i+1}</button>`).join('')}</div><div class="card dish"><div class="dish-art"><span>WEEK 5 · DINNER</span></div><div class="dish-info"><h3>Herby chicken &amp; rice bowls</h3><p>High-protein · dairy-free · easy to batch</p><div class="stats"><div class="stat"><b>Chicken</b><small>PROTEIN</small></div><div class="stat"><b>4</b><small>SERVINGS</small></div><div class="stat"><b>35 min</b><small>TOTAL</small></div></div></div></div><div class="accordion"><button class="acc-head" aria-expanded="false"><span>Shopping list · 12 items</span><span class="arrow">⌄</span></button><div class="acc-body" hidden><div class="group-title">Produce</div><label class="checkrow"><input type="checkbox"><span>4 lemons</span></label><label class="checkrow"><input type="checkbox"><span>1 bunch flat-leaf parsley</span></label><label class="checkrow"><input type="checkbox"><span>2 cucumbers</span></label><div class="group-title">Meat &amp; grains</div><label class="checkrow"><input type="checkbox"><span>1.2 lb chicken thighs</span></label><label class="checkrow"><input type="checkbox"><span>2 cups basmati rice</span></label><button class="acc-head nested" aria-expanded="false" style="padding:0;width:100%"><span>Pantry staples · 4</span><span class="arrow">⌄</span></button><div class="acc-body" hidden><label class="checkrow"><input type="checkbox"><span>Olive oil</span></label><label class="checkrow"><input type="checkbox"><span>Ground cumin</span></label><label class="checkrow"><input type="checkbox"><span>Sea salt · black pepper</span></label></div></div></div><div class="accordion"><button class="acc-head" aria-expanded="false"><span>Step by step · 5 steps</span><span class="arrow">⌄</span></button><div class="acc-body" hidden><ol class="step-list"><li>Rinse rice until water runs clear.</li><li>Season chicken with lemon zest, cumin, salt and pepper.</li><li>Sear chicken 5 minutes per side; finish until 165°F.</li><li>Rest 5 minutes, then slice.</li><li>Serve over rice with cucumber and parsley.</li></ol><button class="textbutton" style="padding:0">Open cook mode →</button></div></div><div class="accordion"><button class="acc-head" aria-expanded="false"><span>Other ways to eat it</span><span class="arrow">⌄</span></button><div class="acc-body" hidden>Wrap leftovers in a warm tortilla, or serve cold over greens with extra lemon.</div></div><button class="primary-btn sticky-action">Log this meal</button><button class="parking">Can’t eat what I cooked?<small>Find a safer option nearby · works offline</small></button>`}
function parking(){return `<div class="sheet-handle"></div><div class="sheet-head"><h3>Find something that works</h3><span class="offline">● OFFLINE READY</span></div><p class="subcopy" style="margin-top:6px">A quick, dairy-aware backup for right now.</p><div class="venue"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Chipotle</h3><span style="font-size:10px;color:var(--primary);font-weight:800">5 min away</span></div><p>Chicken bowl · rice, black beans, fajita veg, salsa</p></div><span class="label">Say this when ordering</span><div class="quote">“I have a dairy allergy. Please change gloves and use clean utensils. No cheese, sour cream, or queso, and please check the chicken ingredients.”</div><div class="caution"><b>Important:</b> Cross-contact is possible. Ask the team to confirm current ingredients and prep practices before ordering.</div><div class="macro-mini"><span>Estimated meal</span><span>620 kcal</span><span style="color:#2E7D6B;font-weight:800">42 g protein</span></div><button class="primary-btn">Log this meal</button><button class="quiet-btn" style="width:100%;margin-top:8px">Show another option</button><p style="font-size:9px;color:var(--sub);text-align:center;margin-top:10px">Saved options are available without a signal.</p>`}
function cook(){return `<div class="cook"><div class="cook-top"><button class="close">×</button><span class="step-count">STEP 2 OF 5</span><span class="awake">◉ Screen stays awake</span></div><div class="cook-progress"><i></i></div><div class="step-kicker">Herby chicken &amp; rice bowls</div><h2>Sear the chicken</h2><p>Heat a little olive oil in a skillet over medium-high. Add the chicken and leave it undisturbed until a deep golden crust forms.</p><div class="cook-illustration">🍳</div><button class="timer-chip" data-timer><span>⏱ Start 5-minute timer</span><b>05:00</b></button><div style="margin-top:12px;font-size:11px;color:var(--sub)">Then flip and cook the other side until the centre reaches <b style="color:var(--fg)">165°F</b>.</div><div class="cook-bottom"><button aria-label="Previous step">←</button><button class="next">Next step</button><button aria-label="Repeat step">↻</button></div><div style="text-align:center;color:var(--sub);font-size:10px;margin-top:11px">Swipe left or right to move between steps</div></div>`}
function train(){return `<div class="subhead">Train</div><p class="subcopy">Your plan, your pace. Built to progress steadily.</p><div class="program-banner"><small>ACTIVE PROGRAM · WEEK 5 OF 12</small><h2>Foundations · 3 days/week</h2><p>Next up: Day A · Lower body + push</p></div><div class="nextday"><div class="nextday-head"><div><span class="label" style="margin:0">NEXT WORKOUT</span><h3>Day A · Lower + push</h3><p>Back squat · bench press · RDL · core</p></div><button class="startbtn">Start<br>workout →</button></div></div><div class="sectionline"><h3>This week’s working sets</h3><span style="font-size:10px;color:var(--sub)">Target ≥10 / muscle</span></div>${[['Quads',8],['Hamstrings',10],['Glutes',8],['Chest',12],['Back',10],['Shoulders',6],['Biceps',8]].map(([m,n])=>`<div class="muscle"><div><b>${m}</b><small>${n<10?'Below weekly target':'On track'}</small></div><div><span class="setcount">${n} <small>sets</small></span>${n<10?'<span class="flag">LOW · under 10</span>':''}</div></div>`).join('')}`}
function workout(){return `<div class="workout-top"><button class="textbutton" style="padding:0">‹ Workout</button><b>Day A · Lower + push</b><span class="timer">01:42</span></div><div class="exercise-card"><small>EXERCISE 1 OF 4 · COMPOUND</small><h2>Back squat</h2><div class="prescription">3 × 5 · 82.5 kg</div><div class="reason"><strong>Up 2.5 kg from last time</strong> — all 3 sets hit 8 reps.</div><div class="last-inline">LAST SESSION　80 kg × 8 · 8 · 8　 <span style="color:var(--primary);font-weight:800">✓ completed</span></div></div><div class="restbar"><span>Rest timer · running</span><b>01:42　 ＋30s</b></div><div class="sectionline"><h3>Log your sets</h3><span style="font-size:10px;color:var(--sub)">Tap ✓ when done</span></div><div class="grid-head"><span>SET</span><span>WEIGHT</span><span>REPS</span><span>DONE</span></div>${[1,2,3].map((n)=>`<div class="set-row"><span class="set-n">${n}</span><input class="entry" value="82.5" aria-label="Set ${n} weight in kilograms"><input class="entry" value="5" aria-label="Set ${n} reps"><button class="done" aria-label="Complete set ${n}">✓</button></div>`).join('')}<div class="plate-card"><h4>Plate calculator · 82.5 kg total</h4><div class="plate-visual"><span class="bar"></span><i class="plate small"></i><i class="plate"></i><i class="plate small"></i><span class="bar"></span></div><div class="plate-amount">Per side: 20 kg + 10 kg + 1.25 kg plates</div></div><button class="primary-btn">Finish exercise</button>`}
function progress(){return `<div class="subhead">Progress</div><p class="subcopy">Patterns over time, without the noise.</p><div class="range">${['1M','3M','6M','1Y','All'].map((x,i)=>`<button class="chip ${i===1?'active':''}">${x}</button>`).join('')}</div><div class="chart-card"><div class="chart-title"><b>Weight trend</b><small>last 3 months</small></div><div class="weight-big">185.2 <small>lb · raw weigh-ins</small></div><div class="chart"><div class="trend"></div><div class="points">${[10,17,12,26,23,36,34,45,40,55,52,64].map((n)=>`<i style="--v:${n}"></i>`).join('')}</div></div><div class="chart-legend"><span><i class="legend-dot"></i>Daily weigh-in</span><span><i class="legend-line"></i>Smoothed trend · −0.6 lb/week</span></div></div><div class="chart-card"><div class="chart-title"><b>Days logged</b><small>last 21 days</small></div><div style="font:800 20px Manrope;margin-top:7px">18 <small style="font:500 11px 'DM Sans';color:var(--sub)">of the last 21 days logged</small></div><div class="heat">${Array.from({length:21},(_,i)=>`<i class="${[0,1,3,4,6,7,8,10,11,12,14,15,16,18,19,20].includes(i)?(i%3===0?'mid':'on'):''} ${i===20?'today':''}"></i>`).join('')}</div></div><div class="chart-card"><div class="chart-title"><b>Calories vs target</b><small>daily average · 7 days</small></div><div class="chart" style="height:100px"><div class="target-line"></div><span class="target-tag">2,040 target</span><div class="cal-bars">${[62,76,58,80,68,48,73].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div><div class="chart-legend"><span><i class="legend-dot" style="background:#83b9a6"></i>Calories logged</span><span><i class="legend-line" style="border-top:2px dashed var(--clay);background:none"></i>Target</span></div></div><div class="card"><div class="chart-title"><b>This week</b><small>Oct 31 – Nov 6</small></div><div class="week-summary"><div class="summary-tile"><b>1,980</b><small>AVG KCAL / DAY</small></div><div class="summary-tile"><b>−0.6 lb</b><small>AVG WEIGHT CHANGE</small></div><div class="summary-tile"><b>≈2,540</b><small>MAINTENANCE KCAL</small></div><div class="summary-tile"><b>71%</b><small>PROTEIN TARGET HIT</small></div></div><div class="confidence" style="margin-top:8px">◉ Medium confidence · based on 7 weeks of intake + weight data</div></div>`}
function ai(){return `<div class="subhead">Review estimate</div><p class="subcopy">Nothing is saved until you confirm.</p><div class="photo"><div class="plate-shape"></div></div><div class="estimate-banner"><b>Portion assumption · please check</b><p>Assumed a <strong>2-cup bowl</strong> of chicken, rice and vegetables. Adjust once to scale every estimate below.</p></div><div class="scale-head"><span>Scale all portions</span><span class="scale-value" id="scaleVal">1.0×</span></div><input id="scale" class="slider" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Scale all estimated portions"><div class="scale-ticks"><span>0.5×</span><span>1.0×</span><span>1.5×</span><span>2.0×</span></div><span class="label">Correct any field</span>${[['Chicken, cooked · g',150],['White rice · g',180],['Roasted vegetables · g',100],['Olive oil · g',8]].map((x,i)=>`<div class="estimate-row"><label>${x[0]}</label><input class="scaled" type="number" value="${x[1]}" data-base="${x[1]}" aria-label="${x[0]}"></div>`).join('')}<div class="math"><div><b>612</b><small>kcal</small></div><div><b>46</b><small>protein g</small></div><div><b>67</b><small>carbs g</small></div><div><b>16</b><small>fat g</small></div></div><button class="primary-btn">Confirm &amp; add to Dinner</button><button class="quiet-btn" style="width:100%;margin-top:8px">Retake photo</button>`}
function more(){return `<div class="subhead">More</div><p class="subcopy">Your tools and preferences, all on this phone.</p><div class="sectionline"><h3>Your Intake</h3></div><div class="card more-list">${[['▦','Recipes','12 saved recipes'],['◉','Allergen profile','Dairy allergy · strict'],['⚙','Settings','Units, theme, AI options'],['↗','Export your data','CSV · stored locally'],['ⓘ','About Intake','Version 0.9 mockup']].map(x=>`<div class="menuitem"><span class="mi">${x[0]}</span><div class="menu-copy"><b>${x[1]}</b><small>${x[2]}</small></div><span class="chevron">›</span></div>`).join('')}</div><div class="assistant-card"><div class="assist-head"><div class="assistant-mark">⌕</div><h3>Optional web assistant</h3></div><p>Ask about dairy-free ingredients, restaurant menus, or recipe swaps. Web answers are suggestions—not a substitute for checking labels or asking the restaurant.</p><div class="assistant-features"><span>Ingredient research</span><span>Menu lookup</span><span>Recipe swaps</span></div><div class="online-note">Uses internet only when you ask · never required for tracking</div><button class="quiet-btn" style="width:100%;margin-top:12px">Explore web assistant</button></div><div class="remaining"><strong>Private by design</strong>Your meals, training, and weight stay on this device. No accounts, analytics, or subscriptions. Optional web searches share only the question you choose to send.</div>`}
function settings(){return `<div class="sheet-head"><button class="textbutton" style="padding:0">‹ More</button><h3 style="font:800 19px Manrope;margin-right:auto;margin-left:10px">Settings</h3></div><div class="sectionline"><h3>Preferences</h3></div><div class="setting-row"><div><b>Units</b><small>Weight and length</small></div><div class="segmented"><button class="active">lb / in</button><button>kg / cm</button></div></div><div class="setting-row"><div><b>Theme</b><small>App appearance</small></div><div class="segmented"><button>System</button><button class="active">Light</button><button>Dark</button></div></div><div class="sectionline"><h3>Optional AI tools</h3></div><p class="subcopy">Not needed for food logging or training. Enable only if you want photo estimates or web-assisted ingredient research.</p><label class="label">AI provider key · optional</label><div class="api-field"><input type="password" value="sk-intake-demo-key-••••••" aria-label="API key"></div><button class="testbtn">Test AI connection</button><div class="assistant-card" style="margin-top:10px"><div class="assist-head"><div class="assistant-mark">⌕</div><h3>Web search access</h3></div><p>When enabled, the assistant can look up current menus and ingredient statements. You choose when a question leaves your phone; routine logging remains offline.</p><div class="setting-row" style="border:0;min-height:45px"><b>Allow web search</b><div class="segmented"><button class="active">Off</button><button>On</button></div></div></div><div class="sectionline"><h3>Allergen profile</h3><button class="textbutton">Edit</button></div><div class="allergen-edit"><b>Dairy allergy · strict</b><p>Confirmed dairy ingredients block saving. Possible traces are shown as an amber review.</p><div class="tags"><span>casein</span><span>sodium caseinate</span><span>whey</span><span>lactalbumin</span><span>milk solids</span><span>lactose</span></div></div><button class="quiet-btn" style="width:100%">Add allergen term</button><div class="remaining"><strong>Stored on this phone</strong>Settings and personal data remain local and available offline.</div>`}
const screens=[
['01 · Today','Home, macros, meals',today,'Today'],['02 · Add food','Recents tab',foodSheet,'Today'],['03 · Add food · portion','Serving + live macro maths',portion,'Today'],['04 · Allergen block','Red · exact hidden dairy match',()=>allergen(false),'Today'],['05 · May contain','Amber · soft match review',()=>allergen(true),'Today'],['06 · Plan','12-week meal plan + collapsible sections',plan,'Plan'],['07 · Can’t eat what I cooked','Parking-lot fallback · offline',parking,'Plan'],['08 · Cook mode','Large type · inline timer',cook,'Plan'],['09 · Train','Program + weekly set volume',train,'Train'],['10 · Active workout','Set logging + progression reason',workout,'Train'],['11 · Progress','Trend, logging, calories + summary',progress,'Progress'],['12 · AI photo estimate','Editable estimate + global portion scale',ai,'Today'],['13 · More','Local-first menu',more,'More'],['14 · Settings','Units, theme, API + allergen profile',settings,'More']
];
const root=document.getElementById('gallery');root.innerHTML=screens.map(([title,desc,fn,active],i)=>`<section class="group"><div class="group-head"><h2>${title}</h2><span>${desc}</span></div><div class="pair"><div class="frame-wrap"><div class="frame-label">LIGHT</div>${phone(fn(),{active})}</div><div class="frame-wrap"><div class="frame-label">DARK</div>${phone(fn(),{dark:true,active})}</div></div></section>`).join('');
// interaction wiring
document.querySelectorAll('[data-tabs]').forEach(t=>t.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;t.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('.weekstrip').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('.week');if(!b)return;s.querySelectorAll('.week').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('.accordion').forEach(a=>a.addEventListener('click',e=>{const h=e.target.closest('.acc-head');if(!h)return;const body=h.nextElementSibling;if(!body||!body.classList.contains('acc-body'))return;const open=h.getAttribute('aria-expanded')==='true';h.setAttribute('aria-expanded',String(!open));body.hidden=open;}));
document.querySelectorAll('.checkrow input').forEach(c=>c.addEventListener('change',()=>c.closest('.checkrow').classList.toggle('checked',c.checked)));
document.querySelectorAll('.phone').forEach(p=>{const grams=p.querySelector('#grams');if(grams){const update=()=>{let g=+grams.value||0;const round=(x)=>Math.round(x*10)/10;p.querySelector('#kcal').textContent=Math.round(g*2.09);p.querySelector('#prot').textContent=round(g*.227);p.querySelector('#carb').textContent='0';p.querySelector('#fatval').textContent=round(g*.13);p.querySelector('.primary-btn').textContent=`Add to Lunch · ${Math.round(g*2.09)} kcal`};grams.addEventListener('input',update);p.querySelectorAll('[data-grams]').forEach(c=>c.addEventListener('click',()=>{grams.value=c.dataset.grams;p.querySelectorAll('[data-grams]').forEach(x=>x.classList.toggle('selected',x===c));update()}));}
const scale=p.querySelector('#scale');if(scale){scale.addEventListener('input',()=>{const v=+scale.value;p.querySelector('#scaleVal').textContent=v.toFixed(1)+'×';p.querySelectorAll('.scaled').forEach(i=>{i.value=Math.round(+i.dataset.base*v)})})}
p.querySelectorAll('.done').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('active');b.textContent=b.classList.contains('active')?'✓':'✓'}));const timer=p.querySelector('[data-timer]');if(timer)timer.addEventListener('click',()=>{timer.querySelector('span').textContent='Timer running · tap to pause';timer.querySelector('b').textContent='04:59';timer.style.background='var(--pale)'});
});
// Day navigation and range chips are intentionally tactile active states
document.querySelectorAll('.date-row button').forEach(b=>b.addEventListener('click',()=>{const t=b.parentElement.querySelector('strong');t.textContent=b.textContent==='‹'?'Friday · November 6':'Sunday · November 8'}));document.querySelectorAll('.range').forEach(r=>r.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){r.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));const small=r.parentElement.querySelector('.chart-title small');if(small)small.textContent=b.textContent==='1M'?'last month':`last ${b.textContent.toLowerCase()}`}}));
</script></body></html>
