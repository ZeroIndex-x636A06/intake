n.</div>`}

function tabletToday(){return `<div class="tablet"><aside class="rail">${nav.map(([i,n])=>`<button class="navitem ${n==='Today'?'active':''}"><span class="ico">${i}</span><span>${n}</span></button>`).join('')}</aside><div class="tablet-main"><div class="tablet-head"><div><div class="eyebrow">SUNDAY · NOVEMBER 8</div><h2 class="tablet-cols-heading">Today</h2></div><button class="textbutton">‹　Today　›</button></div><div class="tablet-columns"><div><div class="tablet-card"><h3>Nutrition</h3>${ring()}<div class="hydration"><div class="water-top"><h3>Water</h3><strong>1,850 / 3,000 ml</strong></div><div class="water-bar"><i></i></div><div class="presets"><button>＋ 250 glass</button><button>＋ 500 bottle</button><button>＋ 750 shaker</button><button>＋ custom</button></div></div></div><div class="tablet-card"><h3>Daily insight</h3><p style="font-size:13px">Add a protein-heavy snack before tomorrow’s session. Used recent intake and squat RPE.</p></div></div><div><div class="tablet-card"><h3>Meals</h3><div class="meal"><div class="meal-head"><strong>Breakfast</strong><span>420 kcal</span></div><div class="food">Greek-style coconut yoghurt · 5 g protein</div></div><div class="meal"><div class="meal-head"><strong>Lunch</strong><span>510 kcal</span></div><div class="food">Chicken thigh · 150 g · 34 g protein</div></div><div class="meal"><div class="meal-head"><strong>Dinner</strong><span>Not logged</span></div><div class="food">＋ Add meal</div></div><div class="meal"><div class="meal-head"><strong>Snacks</strong><span>310 kcal</span></div><div class="food">Apple · 0 g protein</div></div></div><div class="tablet-card"><h3>Training today</h3><b>Rest day · tomorrow Day A</b><p style="font-size:11px;color:var(--sub)">Dynamic water target raised by 500 ml on training days.</p></div></div></div></div></div>`}
function tabletProgress(){return `<div class="tablet"><aside class="rail">${nav.map(([i,n])=>`<button class="navitem ${n==='Progress'?'active':''}"><span class="ico">${i}</span><span>${n}</span></button>`).join('')}</aside><div class="tablet-main"><div class="tablet-head"><div><div class="eyebrow">WEIGHT · NUTRITION · TRAINING</div><h2 class="tablet-cols-heading">Progress</h2></div><div class="range">${['1M','3M','6M','1Y','All'].map((x,i)=>`<button class="chip ${i===1?'active':''}">${x}</button>`).join('')}</div></div><div class="tablet-columns"><div><div class="tablet-card"><h3>Weight · 185.2 lb</h3><div class="mini-chart"></div><span class="chart-legend">Raw weigh-ins · trend −0.6 lb/week</span></div><div class="tablet-card"><h3>Days logged · 18 of last 21</h3><div class="heat">${Array.from({length:21},(_,i)=>`<i class="${i%4?'on':''}"></i>`).join('')}</div></div></div><div><div class="tablet-card"><h3>Calories vs 2,040 kcal target</h3><div class="chart" style="height:140px"><div class="target-line"></div><div class="cal-bars">${[62,76,58,80,68,48,73].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div></div><div class="tablet-card"><h3>Weekly check-in</h3><div class="week-summary"><div class="summary-tile"><b>1,980</b><small>AVG KCAL</small></div><div class="summary-tile"><b>−0.6 lb</b><small>WEIGHT CHANGE</small></div><div class="summary-tile"><b>≈2,540</b><small>MAINTENANCE · MEDIUM</small></div><div class="summary-tile"><b>71%</b><small>PROTEIN HIT RATE</small></div></div></div></div></div></div></div>`}
function states(){return `<div class="subhead">Designed states</div><p class="subcopy">Clear feedback for sparse data, slow work, and failures.</p><div class="empty-state"><b>No weigh-ins yet</b><br>Add 14 days of weigh-ins before Intake estimates a trend or maintenance.</div><div class="loading-state"><span class="spinner"></span>Searching… · Reading 6 recipes… · Checking allergens locally…</div><div class="error-state"><b>Could not refresh menu</b><br>This site blocks automated access. Paste menu text or import its PDF.</div><div class="empty-state"><b>No connected health data</b><br>Grant only the permissions you want; manual tracking still works.</div>`}

const screens=[
['01 · Today','Home, macros, meals',today,'Today'],['02 · Add food','Recents tab',foodSheet,'Today'],['03 · Add food · portion','Serving + live macro maths',portion,'Today'],['04 · Allergen block','Red · exact hidden dairy match',()=>allergen(false),'Today'],['05 · May contain','Amber · soft match review',()=>allergen(true),'Today'],['06 · Plan','12-week meal plan + collapsible sections',plan,'Plan'],['07 · Can’t eat what I cooked','Parking-lot fallback · offline',parking,'Plan'],['08 · Cook mode','Large type · inline timer',cook,'Plan'],['09 · Train','Program + weekly set volume',train,'Train'],['10 · Active workout','Set logging + progression reason',workout,'Train'],['11 · Progress','Trend, logging, calories + summary',progress,'Progress'],['12 · AI photo estimate','Editable estimate + global portion scale',ai,'Today'],['13 · More','Local-first menu',more,'More'],['14 · Settings','Units, theme, optional AI + allergen profile',settings,'More'],['15 · Hydration sheet','Presets, dynamic target, entries + undo',waterSheet,'Today'],['16 · AI model picker','Per-task routing, cost and benchmarks',models,'More'],['17 · Model picker sheet','Task-filtered models + privacy tags',picker,'More'],['18 · Recipe Hunter','Macro constraints + dairy-free results',hunter,'Plan'],['19 · Recipe detail','Ingredient check, steps, macros',recipeDetail,'Plan'],['20 · Plan B finder','Location prompt + fit-ranked meals',planB,'Plan'],['21 · Plan B · landscape tablet','Two-pane list/detail · large touch targets',tabletB,'Plan'],['22 · Menu import','Sources, formats + explicit failure',menuImport,'More'],['23 · Menu import review','Accept / reject before local save',importReview,'More'],['24 · NFC meal prep','Templates, write flow + undo',nfc,'Today'],['25 · Explosive performance · entry','Jump test · inches · computed reach',jumpEntry,'Train'],['26 · Explosive performance · progress','Jump trend over weekly sets',jumpProgress,'Progress'],['27 · Health Connect','Per-type permissions + calorie maths',health,'More'],['28 · Weekly check-in report','Preview + two grayscale Letter pages',weeklyReport,'Progress'],['29 · Backups & sync','Nightly backup + optional pairing',backup,'More'],['30 · Wear OS companion','Round true-black display · states',watch,'Train'],['31 · Today · landscape tablet','Navigation rail + two columns',tabletToday,'Today'],['32 · Progress · landscape tablet','Navigation rail + two-column analytics',tabletProgress,'Progress'],['33 · Empty / loading / error','Honest states · no false certainty',states,'More']
];
const root=document.getElementById('gallery');root.innerHTML=screens.map(([title,desc,fn,active],i)=>`<section class="group"><div class="group-head"><h2>${title}</h2><span>${desc}</span></div><div class="pair"><div class="frame-wrap"><div class="frame-label">LIGHT</div>${phone(fn(),{active})}</div><div class="frame-wrap"><div class="frame-label">DARK</div>${phone(fn(),{dark:true,active})}</div></div></section>`).join('');
// interaction wiring
document.querySelectorAll('[data-tabs]').forEach(t=>t.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;t.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('.weekstrip').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('.week');if(!b)return;s.querySelectorAll('.week').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('.accordion').forEach(a=>a.addEventListener('click',e=>{const h=e.target.closest('.acc-head');if(!h)return;const body=h.nextElementSibling;if(!body||!body.classList.contains('acc-body'))return;const open=h.getAttribute('aria-expanded')==='true';h.setAttribute('aria-expanded',String(!open));body.hidden=open;}));
document.querySelectorAll('.checkrow input').forEach(c=>c.addEventListener('change',()=>c.closest('.checkrow').classList.toggle('checked',c.checked)));
document.querySelectorAll('.phone').forEach(p=>{const grams=p.querySelector('#grams');if(grams){const update=()=>{let g=+grams.value||0;const round=(x)=>Math.round(x*10)/10;p.querySelector('#kcal').textContent=Math.round(g*2.09);p.querySelector('#prot').textContent=round(g*.227);p.querySelector('#carb').textContent='0';p.querySelector('#fatval').textContent=round(g*.13);p.querySelector('.primary-btn').textContent=`Add to Lunch · ${Math.round(g*2.09)} kcal`};grams.addEventListener('input',update);p.querySelectorAll('[data-grams]').forEach(c=>c.addEventListener('click',()=>{grams.value=c.dataset.grams;p.querySelectorAll('[data-grams]').forEach(x=>x.classList.toggle('selected',x===c));update()}));}
const scale=p.querySelector('#scale');if(scale){scale.addEventListener('input',()=>{const v=+scale.value;p.querySelector('#scaleVal').textContent=v.toFixed(1)+'×';p.querySelectorAll('.scaled').forEach(i=>{i.value=Math.round(+i.dataset.base*v)})})}
p.querySelectorAll('.done').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('active');b.textContent=b.classList.contains('active')?'✓':'✓'}));const timer=p.querySelector('[data-timer]');if(timer)timer.addEventListener('click',()=>{timer.querySelector('span').textContent='Timer running · tap to pause';timer.querySelector('b').textContent='04:59';timer.style.background='var(--pale)'});
});
// Day navigation and range chips are intentionally tactile active states
document.querySelectorAll('.date-row button').forEach(b=>b.addEventListener('click',()=>{const t=b.parentElement.querySelector('strong');t.textContent=b.textContent==='‹'?'Friday · November 6':'Sunday · November 8'}));document.querySelectorAll('.range').forEach(r=>r.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){r.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));const small=r.parentElement.querySelector('.chart-title small');if(small)small.textContent=b.textContent==='1M'?'last month':`last ${b.textContent.toLowerCase()}`}}));

document.querySelectorAll('.disclosure').forEach(b=>b.addEventListener('click',()=>{const body=b.nextElementSibling;const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));body.hidden=open;b.textContent=open?'Why this suggestion?　⌄':'Hide why　⌃'}));
document.querySelectorAll('[data-water-open]').forEach(b=>b.addEventListener('click',()=>{b.textContent='Custom amount';b.classList.add('selected')}));
document.querySelectorAll('.segmented').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}));
document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{if(b.hasAttribute('data-water-open'))return;const v=parseInt(b.textContent.match(/\d+/)?.[0]||'250');const card=b.closest('.hydration');if(card){const total=card.querySelector('.water-top strong');if(total){const next=Math.min(3000,(parseInt(total.textContent.replace(/,/g,''))||1850)+v);total.innerHTML=`${next.toLocaleString()} <small style="font:500 10px 'DM Sans';color:var(--sub)">/ 3,000 ml</small>`;card.querySelector('.water-bar i').style.width=(next/3000*100)+'%'}}}));
document.querySelectorAll('.recipe-card button,.source-row button,.restaurant button,.menuitem,.model-choice .textbutton,.testbtn').forEach(b=>b.addEventListener('click',()=>{if(b.classList.contains('textbutton'))b.textContent='Selected';else if(b.classList.contains('testbtn'))b.textContent='✓ Connection verified';}));
document.querySelectorAll('.switch').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Allowed':'Not allowed'}));
document.querySelectorAll('.watch-rpe button').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.style.background=x===b?'#245449':'#111')}));
document.querySelectorAll('.watch-button').forEach(b=>b.addEventListener('click',()=>{if(b.textContent==='＋'||b.textContent==='−'){const n=b.parentElement.querySelector('b');n.textContent=Math.max(0,+n.textContent+(b.textContent==='＋'?1:-1))}}));
</script></body></html>
